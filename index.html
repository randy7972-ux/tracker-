<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>MHT-CET Planner</title>
<link rel="manifest" href="./manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MHT-CET Planner">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">

<style>
/* ============================================================
   MHT-CET Planner · stylesheet
   1 Tokens · 2 Base · 3 Layout · 4 Home · 5 Calendar
   6 Timeline · 7 Navigation · 8 Lightbox · 9 Motion
   Palette is strictly black / white / grey.
   ============================================================ */

/* 1 · TOKENS */
:root{
  /* colour */
  --bg:#000000;--bg2:#0A0A0A;--card:#141414;--soft:#1C1C1C;--sand:#0A0A0A;
  --line:#303030;--div:#292929;
  --text:#FFFFFF;--muted:#A0A0A0;--muted2:#707070;
  --accent:#FFFFFF;
  /* hero card */
  --hnum:#FFFFFF;--hfg:#FFFFFF;--hmuted:#A0A0A0;--hbar:#303030;--hfill:#FFFFFF;
  --note:#0A0A0A;--notetx:#A0A0A0;
  /* type scale */
  --fs-2xs:10px;--fs-xs:11px;--fs-sm:12px;--fs-md:13px;--fs-base:14px;--fs-lg:16px;--fs-xl:17px;
  --fs-hero:clamp(64px,22vw,92px);
  /* spacing (4px grid) */
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:20px;--s6:24px;
  /* radius */
  --r-sm:10px;--r-md:14px;--r-lg:20px;--r-xl:24px;
  /* layout */
  --cgap:3px;--maxw:560px;--gutter:16px;--nav-h:64px;--touch:44px;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px);
  /* motion */
  --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:dark;
}

/* 2 · BASE */
*,*::before,*::after{box-sizing:border-box}
html{background:var(--bg);-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0}
body{
  background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:var(--fs-base);line-height:1.4;letter-spacing:-.005em;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  min-height:100vh;min-height:100dvh;overflow-x:clip;
}
img{max-width:100%}
button{font:inherit;color:inherit;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
h2{font-size:var(--fs-xl);font-weight:600;margin:var(--s5) 0 2px}
button:focus-visible,[role=button]:focus-visible{outline:2px solid #fff;outline-offset:2px}

/* 3 · LAYOUT */
body{
  display:flex;justify-content:center;
  padding:
    calc(var(--s4) + var(--sat))
    calc(var(--gutter) + var(--sar))
    calc(var(--nav-h) + var(--s6) + var(--sab))
    calc(var(--gutter) + var(--sal));
}
main{width:100%;max-width:var(--maxw);min-width:0}
.view[hidden]{display:none}
.view h2:first-child{margin-top:var(--s1)}
.legend{color:var(--muted);font-size:var(--fs-md);margin:0 0 var(--s3)}
.hint{text-align:center;color:var(--muted);font-size:var(--fs-sm);margin-top:var(--s3)}
.note{background:var(--note);color:var(--notetx);border-radius:var(--r-md);padding:var(--s3);text-align:center;font-size:var(--fs-md);margin-top:14px}

/* 4 · HOME */
.hero{background:var(--card);border:1px solid var(--line);color:var(--hfg);border-radius:var(--r-xl);padding:var(--s5) var(--s5) var(--s4);text-align:center}
.label{font-size:var(--fs-sm);letter-spacing:.14em;text-transform:uppercase;color:var(--hmuted)}
.num{font-size:var(--fs-hero);font-weight:700;line-height:1;margin:6px 0 0;color:var(--hnum);font-variant-numeric:tabular-nums}
.unit{font-size:var(--fs-lg);color:var(--muted)}
.sub{font-size:var(--fs-base);margin-top:var(--s2);color:var(--text)}
.bar{height:6px;background:var(--hbar);border-radius:99px;margin-top:var(--s4);overflow:hidden}
.bar i{display:block;height:100%;background:var(--hfill);border-radius:99px;transition:width .3s var(--ease)}

/* 5 · CALENDAR */
.cal{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:var(--s3);margin-top:var(--s3)}
.calh{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.calh b{font-size:var(--fs-xl);font-weight:600;letter-spacing:-.01em}
.nav{width:var(--touch);height:var(--touch);border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:var(--fs-lg);cursor:pointer}
.nav:disabled{opacity:.3;cursor:default}
.dow,.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:var(--cgap)}
.dow span{font-size:var(--fs-xs);color:var(--muted);text-align:center;padding:var(--s1) 0 var(--s2)}
.d{position:relative;height:46px;min-width:0;padding:0;border:0;border-radius:var(--s3);background:transparent;color:var(--text);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.d.blank{cursor:default}
.d.win{background:var(--soft);border-radius:0}
.d.win.ws{border-radius:var(--s3) 0 0 var(--s3)}
.d.win.we{border-radius:0 var(--s3) var(--s3) 0}
.d.win:not(.we)::before{content:"";position:absolute;top:0;bottom:0;left:100%;width:var(--cgap);background:var(--soft)}
.d.win.sel::before{display:none}
.d{font-weight:500;font-variant-numeric:tabular-nums}
.d.test{font-weight:600}
.d.test::after{content:"";position:absolute;bottom:7px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--accent)}
.d.today{box-shadow:inset 0 0 0 1.5px var(--accent);font-weight:700}
.d.sel,.d.win.sel{background:var(--accent);color:var(--bg);font-weight:700;border-radius:var(--s3);box-shadow:none}
.d.sel.test::after{background:var(--bg)}
.d small{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.key{display:flex;gap:var(--s3);justify-content:center;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:var(--fs-xs);margin-top:var(--s2)}
.key i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.key .k1{width:6px;height:6px;margin:0 6px 0 2px;border-radius:50%;background:var(--accent)}
.key .k2{background:var(--soft);border:1px solid var(--line)}
.key .k3{border:1.5px solid var(--accent)}
.chip{min-height:var(--touch);border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:99px;padding:0 var(--s4);font-size:var(--fs-xs);cursor:pointer}
.selinfo{background:var(--soft);color:var(--text);border:1px solid var(--line);border-radius:var(--r-md);padding:var(--s4);margin-top:var(--s3);display:flex;flex-direction:column;gap:var(--s1);font-size:var(--fs-base)}
.selinfo::before{content:"Selected date";font-size:var(--fs-2xs);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.selinfo b{font-size:var(--fs-xl);font-weight:600}
.selinfo span{color:var(--muted)}
.selinfo u{text-decoration:none;font-weight:700;color:var(--text)}

/* month slide */
@keyframes slr{from{opacity:0;transform:translateX(22px)}to{opacity:1;transform:none}}
@keyframes sll{from{opacity:0;transform:translateX(-22px)}to{opacity:1;transform:none}}
.days.slide-r{animation:slr .24s var(--ease)}
.days.slide-l{animation:sll .24s var(--ease)}

/* 4b · HOME: header, progress caption, next card, upcoming list */
.homehead{margin:0 0 var(--s4)}
.homehead h1{margin:0;font-size:22px;font-weight:600;letter-spacing:-.01em;line-height:1.2}
#todaydate{margin-top:2px;color:var(--muted);font-size:var(--fs-md)}
.barcap{display:flex;justify-content:space-between;gap:var(--s2);margin-top:6px;font-size:var(--fs-xs);color:var(--muted);font-variant-numeric:tabular-nums}
.barcap #bp{color:var(--text)}
.ncard{display:block;width:100%;margin-top:var(--s2);text-align:left;background:var(--soft);color:var(--text);border:1px solid var(--accent);border-radius:var(--r-md);padding:var(--s4);cursor:pointer}
.ncard span{display:block}
.ncard .nc-top{display:flex;justify-content:space-between;align-items:center;gap:var(--s2);margin-bottom:var(--s2)}
.nc-code{font-size:22px;font-weight:700;line-height:1}
.nc-title{font-size:var(--fs-base);overflow-wrap:anywhere}
.ncard .nc-meta{display:flex;justify-content:space-between;gap:var(--s2);margin-top:var(--s3);padding-top:var(--s3);border-top:1px solid var(--div);font-size:var(--fs-sm);color:var(--muted)}
.ulist{margin-top:var(--s2);background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
.urow{display:flex;gap:10px;width:100%;min-height:var(--touch);text-align:left;background:none;color:var(--text);border:0;border-top:1px solid var(--div);padding:10px var(--s3);cursor:pointer}
.urow:first-child{border-top:0}
.urow:active{transform:none;background:var(--soft)}
.urow span{display:block}
.ur-date{width:44px;flex:none;text-align:center}
.ur-date b{display:block;font-size:var(--fs-xl);line-height:1.1}
.ur-date small{color:var(--muted);font-size:var(--fs-xs)}
.ur-main{flex:1;min-width:0}
.urow .ur-top{display:flex;justify-content:space-between;align-items:center;gap:var(--s2)}
.ur-code{font-weight:700;font-size:var(--fs-md)}
.ur-title{margin-top:2px;font-size:var(--fs-sm);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ur-gap{margin-top:2px;font-size:var(--fs-xs);color:var(--muted)}

/* 6 · TIMELINE */
#list{position:relative;padding-left:28px}
#list::before{content:"";position:absolute;left:8px;top:23px;bottom:0;width:2px;background:var(--line)}
.card{position:relative;background:var(--sand);border:1px solid var(--line);border-radius:var(--r-md);padding:11px var(--s3)}
.card::before{content:"";position:absolute;left:-26px;top:17px;width:12px;height:12px;border-radius:50%;background:var(--bg);border:2px solid var(--muted2)}
#list>.card:last-child::after{content:"";position:absolute;left:-28px;width:20px;top:31px;bottom:-1px;background:var(--bg)}
.card.past{opacity:.6}
.card.past::before{background:var(--muted2)}
.card.nxt{background:var(--soft);border-color:var(--accent)}
.card.nxt::before{left:-27px;top:16px;width:14px;height:14px;background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 3px var(--bg),0 0 0 4px var(--accent)}
.card.mo{cursor:pointer;background:var(--card)}
.card.nxt.mo{background:var(--soft)}
.head{display:flex;gap:10px}
.date{width:58px;flex:none;white-space:nowrap;text-align:center}
.date b{display:block;font-size:20px;line-height:1}
.date small{color:var(--muted);font-size:var(--fs-xs)}
.body{flex:1;min-width:0}
.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:var(--s1) var(--s2);margin-bottom:6px}
.code{font-weight:700;font-size:15px;color:var(--accent)}
.card.nxt .code::after{content:"Next";margin-left:var(--s2);padding:2px 6px;border-radius:99px;background:var(--accent);color:var(--bg);font-size:var(--fs-2xs);font-weight:700;letter-spacing:.1em;text-transform:uppercase;vertical-align:2px}
.badge{font-size:var(--fs-xs);font-weight:600;color:var(--accent);background:var(--soft);padding:2px 9px;border-radius:99px;white-space:nowrap}
.card.nxt .badge{background:var(--bg)}
.title{font-size:var(--fs-base);font-weight:500;overflow-wrap:anywhere}
.tap{font-size:var(--fs-sm);color:var(--muted);margin-top:var(--s2);font-weight:500}
.card.open .tap{display:none}
.plan{display:grid;grid-template-rows:0fr;opacity:0;visibility:hidden;margin-top:0;transition:grid-template-rows .3s var(--ease),opacity .25s var(--ease),margin-top .3s var(--ease),visibility 0s .3s}
.plan-in{min-height:0;overflow:hidden}
.card.open .plan{grid-template-rows:1fr;opacity:1;visibility:visible;margin-top:var(--s3);transition-delay:0s}
.plan img{display:block;width:100%;height:auto;border-radius:var(--r-sm);border:1px solid var(--line);background:#fff;cursor:zoom-in;filter:grayscale(1) brightness(.95)}
.zoomhint{font-size:var(--fs-xs);color:var(--muted);text-align:center;margin-top:6px}
.gapc{display:flex;align-items:center;gap:var(--s2);margin:var(--s2) 0 var(--s2) 2px;color:var(--muted);font-size:var(--fs-sm)}
.gapc b{color:var(--text);background:var(--soft);border:1px solid var(--div);padding:3px 10px;border-radius:99px;font-size:var(--fs-sm);font-weight:600}

/* 7 · BOTTOM NAVIGATION */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;gap:var(--s1);background:var(--bg2);border-top:1px solid var(--div);padding:6px calc(var(--s3) + var(--sar)) calc(6px + var(--sab)) calc(var(--s3) + var(--sal))}
.tab{position:relative;flex:1;max-width:180px;min-height:54px;border:0;background:none;color:var(--muted);font-size:var(--fs-xs);font-weight:500;letter-spacing:.02em;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--s1);border-radius:var(--s3);cursor:pointer}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab:after{content:"";position:absolute;top:-7px;left:50%;width:0;height:2px;border-radius:2px;background:#fff;transform:translateX(-50%);transition:width .25s var(--ease)}
.tab.on{color:var(--text);font-weight:600}
.tab.on:after{width:32px}

/* 8 · LIGHTBOX */
#lb{position:fixed;inset:0;background:rgba(0,0,0,.95);display:none;align-items:center;justify-content:center;z-index:50;overflow:hidden;cursor:zoom-out}
#lb.on{display:flex}
#lb img{width:calc(100vh - 32px);width:calc(100dvh - 32px);max-width:none;transform:rotate(90deg);border-radius:6px;background:#fff;flex:none}
@media (orientation:landscape){#lb img{width:min(96vw,1100px);transform:none}}
#lb em{position:absolute;bottom:14px;left:0;right:0;text-align:center;color:#ccc;font-size:var(--fs-sm);font-style:normal}

/* 9 · MOTION */
@keyframes viewin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.view:not([hidden]){animation:viewin .24s var(--ease)}
button,.card.mo{transition:transform .12s var(--ease),background-color .2s var(--ease),border-color .2s var(--ease)}
.tab{transition:color .2s var(--ease),transform .12s var(--ease)}
button:active,.card.mo:active{transform:scale(.97)}
.tab:active{transform:scale(.94)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Larger screens: slightly more breathing room */
@media (min-width:768px){
  :root{--gutter:24px}
  body{padding-top:calc(var(--s6) + var(--sat))}
}
@media (max-width:359px){
  :root{--gutter:12px}
  .hero{padding:var(--s4) var(--s4) var(--s3)}
  .date{width:50px}
  .cal{padding:var(--s2)}
  :root{--cgap:2px}
}

/* PWA install affordance */
#install-app{margin-top:10px;min-height:44px;padding:0 14px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--text);font-size:var(--fs-sm);font-weight:600;cursor:pointer}
#install-app[hidden]{display:none}
</style>
</head>
<body>
<main>
  <section class="view" id="v-home">
    <header class="homehead">
      <h1>MHT-CET 2027</h1>
      <div class="today" id="todaydate"></div>
      <button id="install-app" type="button" hidden>Install app</button>
    </header>
    <section class="hero">
      <div class="label" id="label">Days remaining</div>
      <div class="num" id="num">0</div>
      <div class="unit">days left</div>
      <div class="sub" id="sub"></div>
      <div class="bar"><i id="fill"></i></div>
      <div class="barcap"><span id="bl"></span><span id="bp"></span><span id="br"></span></div>
    </section>
    <h2>Next test</h2>
    <div id="nextcard"></div>
    <h2 id="h-up">Coming up</h2>
    <div id="up"></div>
  </section>

  <section class="view" id="v-calendar" hidden>
    <section class="cal" id="calbox">
      <div class="calh"><button class="nav" id="prev" aria-label="Previous month">‹</button><b id="mname"></b><button class="nav" id="nextm" aria-label="Next month">›</button></div>
      <div class="dow"><span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span></div>
      <div class="days" id="days"></div>
      <div class="key"><span><i class="k1"></i>Test day</span><span><i class="k2"></i>21 Nov – 4 Dec</span><span><i class="k3"></i>Today</span><button class="chip" id="tod">Jump to today</button></div>
    </section>
    <div class="selinfo" id="selinfo" aria-live="polite"></div>
    <div class="hint">Swipe left or right to change month</div>
  </section>

  <section class="view" id="v-timeline" hidden>
    <h2>Test timeline</h2>
    <p class="legend">Gaps between tests · tap PT to see its syllabus</p>
    <div id="list"></div>
    <div class="note">After Boards schedule will be shared</div>
  </section>
</main>
<nav class="tabs" aria-label="Sections">
  <button class="tab on" data-v="home" aria-current="page"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"/></svg>Home</button>
  <button class="tab" data-v="calendar"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>Calendar</button>
  <button class="tab" data-v="timeline"><svg viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg>Timeline</button>
</nav>
<div id="lb" role="dialog" aria-modal="true" aria-label="Syllabus preview"><img alt="Syllabus" src=""><em>Tap anywhere to close</em></div>
<script>
(function(){
  var DAY=864e5,wS=new Date(2026,10,21),wE=new Date(2026,11,4);
  var names=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"],mon=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"],MON=["January","February","March","April","May","June","July","August","September","October","November","December"];

  function left(a,b){return Math.round((b-a)/DAY);}
  function same(a,b){return a.getTime()===b.getTime();}
  function fd(d){return d.getDate()+" "+mon[d.getMonth()];}
  function badge(d){var n=left(today,d);return n<0?"Done":n===0?"Today":n===1?"Tomorrow":"in "+n+" days";}
  function nextIdx(d){for(var i=0;i<S.length;i++)if(S[i][0]>=d)return i;return -1;}
  var sel=today, cur={y:today.getFullYear(),m:today.getMonth()};
  var MIN={y:2026,m:10},MAX={y:2027,m:1};
  if(cur.y*12+cur.m<MIN.y*12+MIN.m)cur={y:MIN.y,m:MIN.m};
  if(cur.y*12+cur.m>MAX.y*12+MAX.m)cur={y:MAX.y,m:MAX.m};

  function hero(){
    var i=nextIdx(sel),num=document.getElementById('num'),sub=document.getElementById('sub'),
        bl=document.getElementById('bl'),bp=document.getElementById('bp'),br=document.getElementById('br');
    document.getElementById('label').textContent=same(sel,today)?"Days remaining":"From "+names[sel.getDay()]+", "+fd(sel);
    if(i<0){num.textContent="–";sub.textContent="no more tests in this planner";document.getElementById('fill').style.width="100%";bl.textContent=bp.textContent=br.textContent="";return;}
    var t=S[i],n=left(sel,t[0]);

    var anchor=i>0?S[i-1][0]:wS,span=Math.max(1,left(anchor,t[0])),pct=Math.min(100,Math.max(0,left(anchor,sel)/span*100));
    document.getElementById('fill').style.width=pct+"%";

  }
  function cal(){

    var idx=cur.y*12+cur.m;
    document.getElementById('prev').disabled=idx<=MIN.y*12+MIN.m;
    document.getElementById('nextm').disabled=idx>=MAX.y*12+MAX.m;
    var first=new Date(cur.y,cur.m,1),n=new Date(cur.y,cur.m+1,0).getDate(),h="";
    for(var b=0;b<first.getDay();b++)h+="<button class='d blank' tabindex='-1'></button>";
    for(var d=1;d<=n;d++){

    document.getElementById('days').innerHTML=h;

    var mo=!!IMG[r[1]],cls="card"+(r[0]<today?" past":"")+(i===nxt?" nxt":"")+(mo?" mo":"");
    if(i>0)html+="<div class='gapc'><b>+"+left(S[i-1][0],r[0])+" days</b> after "+S[i-1][1]+"</div>";
    html+="<div class='"+cls+"'><div class='head'"+(mo?" role='button' tabindex='0' aria-expanded='false'":"")+"><div class='date'><b>"+r[0].getDate()+"</b><small>"+mon[r[0].getMonth()]+" · "+names[r[0].getDay()]+"</small></div><div class='body'><div class='top'><span class='code'>"+r[1]+"</span><span class='badge'>"+badge(r[0])+"</span></div><div class='title'>"+r[2]+"</div>"+(mo?"<div class='tap'>Tap to see syllabus ▾</div>":"")+"</div></div>";
    if(mo)html+="<div class='plan'><div class='plan-in'><img alt='Syllabus for "+r[1]+"' src='"+IMG[r[1]]+"'><div class='zoomhint'>Tap the image to enlarge · tap the card header to close</div></div></div>";
    html+="</div>";
  });
  var list=document.getElementById('list'),lb=document.getElementById('lb');
  list.innerHTML=html;
  list.onclick=function(e){
    var im=e.target.closest('.plan img');
    if(im){lb.querySelector('img').src=im.src;lb.classList.add('on');return;}
    if(e.target.closest('.plan'))return;
    var r=e.target.closest('.card.mo');if(r){r.classList.toggle('open');r.querySelector('.head').setAttribute('aria-expanded',r.classList.contains('open'));}
  };
  list.onkeydown=function(e){if(e.key!=='Enter'&&e.key!==' ')return;var h=e.target.closest('.head[role=button]');if(h){e.preventDefault();h.click();}};
  lb.onclick=function(){lb.classList.remove('on');};
  document.addEventListener('keydown',function(e){if(e.key==='Escape')lb.classList.remove('on');});
  var heroOrig=hero;
  hero=function(){heroOrig();info();};
  function info(){
    var i=nextIdx(sel),t=S.filter(function(r){return same(r[0],sel);})[0],h="<b>"+names[sel.getDay()]+", "+fd(sel)+"</b>";
    if(t)h+="<span>"+t[1]+" · test day</span><span>"+t[2]+"</span>";
    else if(i>=0)h+="<span><u>"+left(sel,S[i][0])+" days</u> until "+S[i][1]+" · "+fd(S[i][0])+"</span>";
    else h+="<span>No more tests</span>";
    document.getElementById('selinfo').innerHTML=h;
  }
  function head(){
    var FULL=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
    document.getElementById('todaydate').textContent=FULL[today.getDay()]+", "+today.getDate()+" "+MON[today.getMonth()]+" "+today.getFullYear();
  }
  function up(){
    var ix=[],nc=document.getElementById('nextcard'),el=document.getElementById('up');
    S.forEach(function(r,i){if(r[0]>=today)ix.push(i);});
    function gap(i){return i>0?"+"+left(S[i-1][0],S[i][0])+" days after "+S[i-1][1]:"";}
    if(!ix.length){nc.innerHTML="<div class='note' style='margin-top:var(--s2)'>All tests in this planner are done</div>";el.innerHTML="";document.getElementById('h-up').hidden=true;return;}
    var a=ix[0],r=S[a];
    nc.innerHTML="<button class='ncard' data-go='timeline'><span class='nc-top'><span class='nc-code'>"+r[1]+"</span><span class='badge'>"+badge(r[0])+"</span></span><span class='nc-title'>"+r[2]+"</span><span class='nc-meta'><span>"+names[r[0].getDay()]+", "+fd(r[0])+"</span><span>"+gap(a)+"</span></span></button>";
    var h="";
    ix.slice(1,4).forEach(function(i){
      var q=S[i],g=gap(i);
      h+="<button class='urow' data-go='timeline'><span class='ur-date'><b>"+q[0].getDate()+"</b><small>"+mon[q[0].getMonth()]+"</small></span><span class='ur-main'><span class='ur-top'><span class='ur-code'>"+q[1]+"</span><span class='badge'>"+badge(q[0])+"</span></span><span class='ur-title'>"+q[2]+"</span>"+(g?"<span class='ur-gap'>"+g+"</span>":"")+"</span></button>";
    });
    el.innerHTML=h?"<div class='ulist'>"+h+"</div>":"";document.getElementById('h-up').hidden=!h;
  }
  document.getElementById('v-home').onclick=function(e){if(e.target.closest('[data-go]'))show('timeline');};
  var tabs=document.querySelectorAll('.tab');
  function show(v,noHash){
    if(!document.getElementById('v-'+v))v='home';
    ['home','calendar','timeline'].forEach(function(n){document.getElementById('v-'+n).hidden=n!==v;});
    for(var k=0;k<tabs.length;k++){var on=tabs[k].dataset.v===v;tabs[k].classList.toggle('on',on);if(on)tabs[k].setAttribute('aria-current','page');else tabs[k].removeAttribute('aria-current');}
    if(!noHash){try{history.replaceState(null,'','#'+v);}catch(x){}}
    window.scrollTo(0,0);
  }
  for(var k=0;k<tabs.length;k++)tabs[k].onclick=function(){show(this.dataset.v);};
  window.addEventListener('hashchange',function(){show(location.hash.slice(1),true);});
  var sx=null,cb=document.getElementById('calbox');
  cb.addEventListener('touchstart',function(e){sx=e.touches[0].clientX;},{passive:true});
  cb.addEventListener('touchend',function(e){
    if(sx===null)return;var dx=e.changedTouches[0].clientX-sx;sx=null;
    if(Math.abs(dx)<50)return;
    var b=document.getElementById(dx>0?'prev':'nextm');if(!b.disabled)b.click();
  });
  var daysEl=document.getElementById('days'),lastM=cur.y*12+cur.m;
  new MutationObserver(function(){
    var m=cur.y*12+cur.m;if(m===lastM)return;
    daysEl.classList.remove('slide-l','slide-r');void daysEl.offsetWidth;
    daysEl.classList.add(m>lastM?'slide-r':'slide-l');lastM=m;
  }).observe(daysEl,{childList:true});
  head();up();hero();cal();
  show(location.hash.slice(1)||'home',true);

  // Install prompt: shown only when Android/Chromium says the app is installable.
  var installBtn=document.getElementById('install-app'),installPrompt=null;
  function isStandalone(){return window.matchMedia('(display-mode: standalone)').matches || window.matchMedia('(display-mode: fullscreen)').matches || window.navigator.standalone===true;}
  if(isStandalone()){installBtn.hidden=true;}
  window.addEventListener('beforeinstallprompt',function(e){
    e.preventDefault();installPrompt=e;if(!isStandalone())installBtn.hidden=false;
  });
  installBtn.addEventListener('click',async function(){
    if(!installPrompt)return;
    installPrompt.prompt();
    try{await installPrompt.userChoice;}catch(e){}
    installPrompt=null;installBtn.hidden=true;
  });
  window.addEventListener('appinstalled',function(){installBtn.hidden=true;installPrompt=null;});
  // A service worker is required for offline use and is available only on HTTPS or localhost.
  if('serviceWorker' in navigator){
    window.addEventListener('load',function(){navigator.serviceWorker.register('./sw.js').catch(function(err){console.warn('Offline support could not be enabled:',err);});});
  }
})();
</script>
</body>
</html>
